<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leikur</title>
    <link rel="stylesheet" href="style.css">
    <style>
        canvas {
            border: 1px solid rgb(240, 45, 15);  /*  rammi utan um canvas */
            touch-action: none; /* svo síminn reyni ekki að scrolla/zooma þegar við snertum canvas */
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas"> </canvas> 
</div>

<script>

let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ball.x = Math.max(ball.radius, Math.min(ball.x, canvas.width - ball.radius));
    ball.y = Math.max(ball.radius, Math.min(ball.y, canvas.height - ball.radius));

    // óvinir eiga líka að haldast innan canvas eftir resize
    if (typeof enemies !== 'undefined') {
        enemies.forEach(e => {
            e.x = Math.min(e.x, canvas.width - e.radius);
            e.y = Math.min(e.y, canvas.height - e.radius);
        });
    }
}

let ball = {
    x: 100,
    y: 100,
    startX: 100,        
    startY: 100,
    speed: 300,         
    radius: 25,
    color: 'green',
    direction: 'none',
    lives: 3,
    invulnerable: 0,    
    update(dt) {
        // dt = tími (í sekúndum) síðan síðasta frame.
        // Með því að margfalda hraða * dt hreyfist boltinn jafn hratt
        // hvort sem tækið teiknar 60 römmum á sekúndu eða 120.
        if (this.direction === 'left') {
            this.x -= this.speed * dt;
        }
        if (this.direction === 'right') {
            this.x += this.speed * dt;
        }
        if (this.direction === 'up') {
            this.y -= this.speed * dt;
        }
        if (this.direction === 'down') {
            this.y += this.speed * dt;
        }
        // Collision with the left and right edges
        if (this.x - this.radius < 0) {
            this.x = this.radius;
        }
        if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
        }
        // Collision with the top and bottom edges
        if (this.y - this.radius < 0) {
            this.y = this.radius;
        }
        if (this.y + this.radius > canvas.height) {
            this.y = canvas.height - this.radius;
        }

        if (this.invulnerable > 0) {
            this.invulnerable -= dt;
        }
    },

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.invulnerable > 0 ? 'rgba(0,128,0,0.4)' : this.color;
        ctx.fill();
        ctx.closePath();
    },

    // færir boltann aftur á byrjunarreit og gefur honum smá "grace period"
    respawn() {
        this.x = this.startX;
        this.y = this.startY;
        this.direction = 'none';
        this.invulnerable = 1.5;
    },

    // kallað þegar hann snertir óvin eða hindrun
    hit() {
        if (this.invulnerable > 0 || gameState !== 'playing') return;
        this.lives--;
        if (this.lives <= 0) {
            endGame(false);
        } else {
            this.respawn();
        }
    }
};


// staða leiks

let gameState = 'playing'; // er annaðhvort playing eða over
let score = 0;
let won = false;

function endGame(didWin) {
    gameState = 'over';
    won = didWin;
}

function resetGame() {
    ball.lives = 3;
    ball.respawn();
    score = 0;
    won = false;
    gameState = 'playing';
    createEnemies();
}


// array fyrir hindrarnir


let obstacles = [];

function createObstacles() {
    obstacles = [];
    const cols = 5, rows = 3;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const fx = (c + 1) / (cols + 1);
            const fy = (r + 1) / (rows + 1) * 0.8 + 0.15;
            if (fx < 0.2 && fy < 0.3) continue; // þetta lætur og svo það er ekkert í byrjurnarreit hjá boltanum :)
            if ((r + c) % 2 !== 0) continue;
            obstacles.push({
                fx: fx,
                fy: fy,
                size: 44,
                shape: (r + c) % 2 === 0 ? 'triangle' : 'triangle',

                draw() {
                    const x = this.fx * canvas.width;
                    const y = this.fy * canvas.height;
                    ctx.fillStyle = 'red';
                    if (this.shape === 'rect') {
                        ctx.fillRect(x - this.size / 2, y - this.size / 2, this.size, this.size);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(x, y - this.size / 2);
                        ctx.lineTo(x - this.size / 2, y + this.size / 2);
                        ctx.lineTo(x + this.size / 2, y + this.size / 2);
                        ctx.closePath();
                        ctx.fill();
                    }
                },

                collidesWithBall() {
                    const x = this.fx * canvas.width;
                    const y = this.fy * canvas.height;
                    const d = Math.hypot(ball.x - x, ball.y - y);
                    return d < ball.radius + this.size * 0.42;
                }
            });
        }
    }
}
createObstacles();


// goal af leiknum. basically farðu í þetta og þá vinnur þú

const goal = {
    fx: 0.9, fy: 0.88, radius: 22,
    get x() { return this.fx * canvas.width; },
    get y() { return this.fy * canvas.height; },
    draw() {
        ctx.fillStyle = 'yellow';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
};


// enemies

class Enemy {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.speed = 130;         // pixlar á sekúndu
        this.sightRadius = 300;   
        this.vx = 0;
        this.vy = 0;

        // flakk
        this.wanderAngle = Math.random() * Math.PI * 2;
        this.wanderTimer = 0;
    }

    update(dt) {
        const dx = ball.x - this.x;
        const dy = ball.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < this.sightRadius && dist > 0.001) {
            this.vx = dx / dist;
            this.vy = dy / dist;
        } else {
            // enemy flakkar svo bara ef hann sér ekki boltann
            this.wanderTimer -= dt;
            if (this.wanderTimer <= 0) {
                this.wanderAngle = Math.random() * Math.PI * 2;
                this.wanderTimer = 1 + Math.random() * 2;
            }
            this.vx = Math.cos(this.wanderAngle);
            this.vy = Math.sin(this.wanderAngle);
        }

        this.x += this.vx * this.speed * dt;
        this.y += this.vy * this.speed * dt;

        // heldur þeim inn í ramma ef þau fara nálægt vegg :)
        if (this.x < this.radius) { this.x = this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
        if (this.x > canvas.width - this.radius) { this.x = canvas.width - this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
        if (this.y < this.radius) { this.y = this.radius; this.wanderAngle = -this.wanderAngle; }
        if (this.y > canvas.height - this.radius) { this.y = canvas.height - this.radius; this.wanderAngle = -this.wanderAngle; }
    }

    draw() {
        const chasing = Math.hypot(ball.x - this.x, ball.y - this.y) < this.sightRadius;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = chasing ? 'red' : 'purple'; // rautt: eltir og fjólublátt: flakkar
        ctx.fill();

        // þetta er auga enemy'ið svo það er létt að sjá hvar hann er að horfa
        const ang = Math.atan2(this.vy, this.vx);
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(ang) * this.radius * 0.5, this.y + Math.sin(ang) * this.radius * 0.5, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

let enemies = [];
function createEnemies() {
    enemies = [
        new Enemy(canvas.width * 0.8, canvas.height * 0.2),
        new Enemy(canvas.width * 0.3, canvas.height * 0.75),
        new Enemy(canvas.width * 0.65, canvas.height * 0.5)
    ];
}
createEnemies();

// hud

function drawHUD() {
    ctx.fillStyle = 'white';
    ctx.textAlign = 'left';
    ctx.fillText('Líf: ' + ball.lives, 20, 36);

    ctx.textAlign = 'right';
    ctx.fillText('Skor: ' + Math.floor(score), canvas.width - 20, 36);
}

function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = won ? 'green' : 'red';
    ctx.font = 'bold 60px sans-serif';
    ctx.fillText(won ? 'ÞÚ VANNST!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

    ctx.fillStyle = 'white';
    ctx.font = '26px sans-serif';
    ctx.fillText('Lokaskor: ' + Math.floor(score), canvas.width / 2, canvas.height / 2 + 15);

    ctx.font = '18px sans-serif';
    ctx.fillText('Ýttu á spacebar eða snertu skjáinn til að byrja aftur', canvas.width / 2, canvas.height / 2 + 50);
}


// game loop

let lastTime = 0;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000; // sekúndur síðan síðasta frame AKA DeltaTime
    lastTime = timestamp;
    dt = Math.min(dt, 0.05);


    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'playing') {
        score += dt * 10;

        ball.update(dt);
        enemies.forEach(e => e.update(dt));

        // árekstur: hindranir
        obstacles.forEach(o => {
            if (o.collidesWithBall()) ball.hit();
        });
        // árekstur: óvinir
        enemies.forEach(e => {
            if (Math.hypot(ball.x - e.x, ball.y - e.y) < ball.radius + e.radius) {
                ball.hit();
            }
        });
        // árekstur: markmið -> vinna leikinn
        if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < ball.radius + goal.radius) {
            endGame(true);
        }

        obstacles.forEach(o => o.draw());
        goal.draw();
        enemies.forEach(e => e.draw());
        ball.draw();
        drawHUD();
    } else {
        drawGameOverScreen();
    }

    requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', resizeCanvas);

document.addEventListener('keydown', (e) => {
    if (gameState === 'over') {
        if (e.code === 'Space') resetGame();
        return;
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        ball.direction = 'left';
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        ball.direction = 'right';
    }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        ball.direction = 'up';
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        ball.direction = 'down';
    }
    if (e.code === 'Space') {
        ball.direction = 'stop';
    }
});


// pointer events fyrir farsíma eða mús :)

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('pointerdown', (e) => {
    if (gameState === 'over') {
        resetGame();
        return;
    }
    touchStartX = e.clientX;
    touchStartY = e.clientY;
});

canvas.addEventListener('pointermove', (e) => {
    if (gameState !== 'playing') return;
    // hunsa ef fingur er ekki niðri 
    if (e.buttons === 0 && e.pointerType !== 'touch') return;

    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;

    const deadZone = 15; // pixlar sem þarf að draga áður en talið er sem hreyfing
    if (Math.abs(dx) < deadZone && Math.abs(dy) < deadZone) {
        return;
    }

    // stærri ásinn ræður stefnunni
    if (Math.abs(dx) > Math.abs(dy)) {
        ball.direction = dx > 0 ? 'right' : 'left';
    } else {
        ball.direction = dy > 0 ? 'down' : 'up';
    }
});

canvas.addEventListener('pointerup', () => {
    ball.direction = 'stop';
});
canvas.addEventListener('pointercancel', () => {
    ball.direction = 'stop';
});

resizeCanvas();
requestAnimationFrame(gameLoop);

    
</script>
</body>
</html>
